<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}初七{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.6;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        header {
            background: #fff;
            border-bottom: 1px solid #e5e5ea;
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header .container { padding: 0 20px; display: flex; align-items: center; justify-content: space-between; }
        header h1 { font-size: 20px; font-weight: 600; }
        header a { color: #1d1d1f; text-decoration: none; }
        header nav a { font-size: 14px; color: #06c; margin-left: 16px; }
        main { min-height: calc(100vh - 130px); }
        footer {
            text-align: center;
            color: #86868b;
            font-size: 13px;
            padding: 30px 0;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="{% url 'notes:list' %}">初七</a></h1>
            <nav>
                {% if user.is_authenticated %}
                    <span style="color:#86868b;font-size:14px;">你好，{{ user.username }}</span>
                    <a href="/admin/">管理</a>
                    <a href="/admin/logout/">退出</a>
                {% else %}
                    <a href="/admin/login/?next={{ request.path }}">登录</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer>初七 · 家庭笔记</footer>
</body>
</html>
